<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Family Gifting Boxes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🎁 Select Your Lucky Gift Box 🎁</h1>
  <p class="subtext">Only one chance per device. Tap a box to reveal your match!</p>
  <div class="box-container" id="boxContainer"></div>

  <script src="script.js"></script>
</body>
</html><style>body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(to bottom right, #e3f2fd, #fce4ec);
  text-align: center;
  padding: 30px;
}

h1 {
  color: #2e7d32;
  margin-bottom: 10px;
}

.subtext {
  color: #555;
  margin-bottom: 20px;
}

.box-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
}

.box {
  width: 110px;
  height: 110px;
  background: #4caf50;
  color: white;
  border: none;
  border-radius: 15px;
  font-size: 18px;
  cursor: pointer;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  transition: transform 0.3s ease, background 0.3s;
  animation: bounce 2s infinite;
}

.box:hover {
  background: #388e3c;
  transform: scale(1.05);
}

.box:disabled {
  background: #aaa;
  cursor: not-allowed;
  animation: none;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}</style><script>// Define the family members
const family = [
  { name: "Dad", phone: "2547XXXXXXXX" },
  { name: "Mom", phone: "2547XXXXXXXX" },
  { name: "Faith", phone: "2547XXXXXXXX" },
  { name: "Grace", phone: "2547XXXXXXXX" },
  { name: "Joy", phone: "2547XXXXXXXX" },
  { name: "Abednego", phone: "2547XXXXXXXX" },
  { name: "Eric", phone: "2547XXXXXXXX" }
];

// Shuffle array (Fisher-Yates)
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// Check if already selected
const alreadySelected = localStorage.getItem("selectedPerson");
const container = document.getElementById("boxContainer");

if (alreadySelected) {
  container.innerHTML = `<p style="color: #c62828; font-weight: bold;">
    You've already selected your gift box 🎁!
  </p>`;
} else {
  const shuffledFamily = shuffle([...family]);

  shuffledFamily.forEach((person, index) => {
    const btn = document.createElement("button");
    btn.className = "box";
    btn.textContent = `Box ${index + 1}`;
    btn.onclick = () => revealPerson(person);
    container.appendChild(btn);
  });
}

function revealPerson(person) {
  alert(`You selected: ${person.name}`);
  localStorage.setItem("selectedPerson", person.name);

  // Redirect to WhatsApp
  const text = encodeURIComponent("I selected you for the gifting.");
  const url = `https://wa.me/${person.phone}?text=${text}`;
  window.location.href = url;
}</script>
